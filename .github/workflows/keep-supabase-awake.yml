# Free-tier Supabase projects pause after 7 idle days. One small read a day
# counts as activity. Uses the publishable key (already public in script.js);
# RLS means it can only read the public `plans` table.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 6 * * *"   # daily 06:17 UTC (10:17 Tbilisi)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read plans
        run: |
          curl --fail --silent --show-error \
            -H "apikey: sb_publishable_R6Ruxp1ehYAGVcFRqrM_Lg_n1ahoV8e" \
            "https://muumpjtpjnoxxdkhqtik.supabase.co/rest/v1/plans?select=code" \
            | tee /dev/stderr | grep -q detective
